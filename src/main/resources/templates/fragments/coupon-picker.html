<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Danh sách mã giảm giá ĐÃ LƯU để người dùng chọn 1 mã (radio).
  - coupons: List<MaGiamGia> đã lưu & còn hiệu lực
  - selectedCode: mã đang chọn (có thể null)
  - inputName: tên field gửi lên server ("coupon" ở giỏ hàng, "maGiamGiaCode" ở thanh toán)
  Tính toán điều kiện/giảm giá phía client nằm trong /js/coupon-picker.js (server vẫn kiểm tra lại).
-->
<div th:fragment="picker(coupons, selectedCode, inputName)" class="coupon-picker is-collapsed mb-3" id="couponPicker">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="small fw-bold text-dark"><i class="fa-solid fa-ticket text-danger me-1"></i> Mã giảm giá của bạn</span>
        <a th:href="@{/}" class="small text-primary text-decoration-none fw-semibold">+ Lưu thêm mã</a>
    </div>

    <div th:if="${coupons == null or coupons.isEmpty()}" class="coupon-empty small text-muted">
        Bạn chưa lưu mã nào. Vào <a th:href="@{/}" class="text-primary fw-semibold">Trang chủ</a> và bấm
        <strong>"Lưu mã"</strong> để nhận ưu đãi.
    </div>

    <div th:unless="${coupons == null or coupons.isEmpty()}" class="d-flex flex-column gap-2">
        <label class="coupon-option" for="coupon_none"
               th:classappend="${selectedCode == null or #strings.isEmpty(selectedCode)} ? 'is-selected'">
            <input type="radio" th:name="${inputName}" id="coupon_none" value=""
                   th:checked="${selectedCode == null or #strings.isEmpty(selectedCode)}">
            <span class="coupon-option-body">
                <span class="fw-semibold text-secondary small">Không dùng mã giảm giá</span>
            </span>
        </label>

        <label class="coupon-option" th:each="c : ${coupons}" th:for="'coupon_' + ${c.maCode}"
               th:classappend="${selectedCode != null and #strings.equalsIgnoreCase(selectedCode, c.maCode)} ? 'is-selected'">
            <input type="radio" th:name="${inputName}" th:id="'coupon_' + ${c.maCode}" th:value="${c.maCode}"
                   th:checked="${selectedCode != null and #strings.equalsIgnoreCase(selectedCode, c.maCode)}"
                   th:data-percent="${c.phanTramGiam != null ? c.phanTramGiam : 0}"
                   th:data-max="${c.soTienGiamToiDa != null ? c.soTienGiamToiDa : 0}"
                   th:data-min="${c.giaTriDonToiThieu != null ? c.giaTriDonToiThieu : 0}">
            <span class="coupon-option-body">
                <span class="d-flex justify-content-between align-items-center gap-2">
                    <span class="font-monospace fw-bold text-success small" th:text="${c.maCode}">CODE</span>
                    <span class="d-inline-flex align-items-center gap-1 flex-shrink-0">
                        <span class="coupon-priority-badge d-none">Ưu tiên</span>
                        <span class="badge bg-danger-subtle text-danger rounded-pill" style="font-size: 10.5px;">
                            <th:block th:if="${c.phanTramGiam != null and c.phanTramGiam > 0}"
                                      th:text="'-' + ${#numbers.formatDecimal(c.phanTramGiam, 0, 'POINT', 0, 'POINT')} + '%'"></th:block>
                            <th:block th:unless="${c.phanTramGiam != null and c.phanTramGiam > 0}"
                                      th:text="'-' + ${#numbers.formatDecimal(c.soTienGiamToiDa, 0, 'POINT', 0, 'POINT')} + 'đ'"></th:block>
                        </span>
                    </span>
                </span>
                <span class="d-block text-dark small text-truncate mt-1" th:text="${c.tenMa}">Tên mã</span>
                <span class="d-block text-muted coupon-condition" style="font-size: 11.5px;"
                      th:text="'Đơn từ ' + ${#numbers.formatDecimal(c.giaTriDonToiThieu, 0, 'POINT', 0, 'POINT')} + ' đ'">Đơn từ 0 đ</span>
            </span>
        </label>

        <button type="button" class="coupon-toggle-btn" id="couponToggleBtn" aria-expanded="false">
            <span class="coupon-toggle-text">Xem tất cả mã</span>
            <i class="fa-solid fa-chevron-down small coupon-toggle-icon"></i>
        </button>
    </div>
</div>
</body>
</html>
