<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng nhập')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <a th:href="@{/}">
                                <img th:src="@{/images/nhanam-logo-green.png}" alt="Nhã Nam BookStore" style="height: 70px; width: auto; object-fit: contain;">
                            </a>
                        </div>
                        <h3 class="fw-bold text-dark">Đăng nhập tài khoản</h3>
                        <p class="text-muted small">Chào mừng bạn trở lại với Nhã Nam BookStore</p>
                    </div>

                    <form th:action="@{/login}" method="post" th:object="${loginRequest}">
                        <input type="hidden" name="redirect" th:value="${redirect}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Tên đăng nhập hoặc Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                                <input type="text" class="form-control bg-light border-start-0" th:field="*{usernameOrEmail}" 
                                       placeholder="admin hoặc email@domain.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label fw-semibold small text-secondary mb-0">Mật khẩu</label>
                                <a th:href="@{/forgot-password}" class="small text-decoration-none text-primary fw-medium">Quên mật khẩu?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                                <input type="password" class="form-control bg-light border-start-0" th:field="*{password}" 
                                       placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm mb-3">
                            Đăng nhập
                        </button>
                    </form>

                    <div class="position-relative my-4 text-center">
                        <hr class="text-muted">
                        <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">hoặc đăng nhập với</span>
                    </div>

                    <!-- External OAuth (Use Case: Google / Facebook Nhà cung cấp xác thực) -->
                    <div class="d-grid gap-2">
                        <a th:href="@{/oauth2/login/google(redirect=${redirect})}" class="btn btn-outline-danger py-2 rounded-3 d-flex align-items-center justify-content-center gap-2 fw-medium">
                            <i class="fa-brands fa-google text-danger"></i> Tiếp tục với Google
                        </a>
                        <a th:href="@{/oauth2/login/facebook(redirect=${redirect})}" class="btn btn-outline-primary py-2 rounded-3 d-flex align-items-center justify-content-center gap-2 fw-medium">
                            <i class="fa-brands fa-facebook-f text-primary"></i> Tiếp tục với Facebook
                        </a>
                    </div>

                    <div class="text-center mt-4 pt-2">
                        <p class="text-muted small mb-0">
                            Chưa có tài khoản? 
                            <a th:href="@{/register}" class="fw-semibold text-primary text-decoration-none">Đăng ký ngay</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
