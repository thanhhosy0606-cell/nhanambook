<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quên mật khẩu')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <a th:href="@{/}">
                                <img th:src="@{/images/nhanam-logo-green.png}" alt="Nhã Nam BookStore" style="height: 70px; width: auto; object-fit: contain;">
                            </a>
                        </div>
                        <h3 class="fw-bold text-dark">Quên mật khẩu?</h3>
                        <p class="text-muted small">Nhập địa chỉ email tài khoản của bạn để nhận mã xác thực (OTP) đặt lại mật khẩu qua thư điện tử.</p>
                    </div>

                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-secondary">Địa chỉ Email đăng ký</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                                <input type="email" name="email" class="form-control bg-light border-start-0" 
                                       placeholder="ví dụ: email@gmail.com" required autofocus>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold rounded-3 shadow-sm mb-3">
                            <i class="fa-solid fa-paper-plane me-1.5"></i> Gửi mã xác nhận qua Email
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-2">
                        <p class="text-muted small mb-0">
                            Bạn đã nhớ mật khẩu? 
                            <a th:href="@{/login}" class="fw-semibold text-primary text-decoration-none">
                                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại Đăng nhập
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
