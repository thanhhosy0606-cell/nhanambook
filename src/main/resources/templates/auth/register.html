<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Đăng ký tài khoản')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <a th:href="@{/}">
                                <img th:src="@{/images/nhanam-logo-green.png}" alt="Nhã Nam BookStore" style="height: 70px; width: auto; object-fit: contain;">
                            </a>
                        </div>
                        <h3 class="fw-bold text-dark">Tạo tài khoản mới</h3>
                        <p class="text-muted small">Khám phá và mua sắm hàng ngàn cuốn sách giá trị</p>
                    </div>

                    <form th:action="@{/register}" method="post" th:object="${registerRequest}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{hoTen}" placeholder="Nguyễn Văn A" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold small text-secondary">Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="email@domain.com" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold small text-secondary">Số điện thoại</label>
                                <input type="tel" class="form-control" th:field="*{sdt}" placeholder="0987654321">
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('sdt')}" th:errors="*{sdt}"></div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold small text-secondary">Tên đăng nhập <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{tenDN}" placeholder="username" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tenDN')}" th:errors="*{tenDN}"></div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold small text-secondary">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" th:field="*{matKhau}" placeholder="Tối thiểu 6 ký tự" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('matKhau')}" th:errors="*{matKhau}"></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm mb-3">
                            Hoàn tất đăng ký
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="text-muted small mb-0">
                            Đã có tài khoản? 
                            <a th:href="@{/login}" class="fw-semibold text-primary text-decoration-none">Đăng nhập</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
