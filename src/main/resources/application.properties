# Import local secrets if present (excluded from Git via .gitignore)
spring.config.import=optional:classpath:application-local.properties

# Server Configuration
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Database Configuration (MySQL web_ban_sach)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/web_ban_sach?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Timezone Vietnam GMT+7
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Auto-cancel unpaid orders scheduler (default: 15 minutes, checks every 60 seconds)
order.unpaid.timeout-minutes=${ORDER_UNPAID_TIMEOUT_MINUTES:15}
order.unpaid.check-interval-ms=${ORDER_UNPAID_CHECK_INTERVAL_MS:60000}

# PayOS Payment Gateway Configuration (https://my.payos.vn)
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:8080/shop/order/}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:8080/shop/order/}

# MoMo Payment Gateway Configuration (https://developers.momo.vn)
momo.partner-code=${MOMO_PARTNER_CODE:MOMO}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8080/shop/order/momo-return}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/payment/momo/ipn}

# BIDV VietQR Bank Account
vietqr.bank.code=${VIETQR_BANK_CODE:BIDV}
vietqr.bank.bin=${VIETQR_BANK_BIN:970418}
vietqr.bank.account-number=${VIETQR_BANK_ACCOUNT:}
vietqr.bank.account-name=${VIETQR_BANK_NAME:}

# MoMo Personal Wallet
momo.wallet.phone=${MOMO_WALLET_PHONE:}
momo.wallet.name=${MOMO_WALLET_NAME:}

# Google Cloud OAuth 2.0 (https://console.cloud.google.com)
google.oauth2.client-id=${GOOGLE_CLIENT_ID:}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth2.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/google/callback}

# Facebook Login OAuth 2.0 (https://developers.facebook.com)
facebook.oauth2.app-id=${FACEBOOK_APP_ID:}
facebook.oauth2.app-secret=${FACEBOOK_APP_SECRET:}
facebook.oauth2.redirect-uri=${FACEBOOK_REDIRECT_URI:http://localhost:8080/auth/facebook/callback}

# Gmail SMTP Configuration (Khoi phuc mat khau qua email thuc te)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
